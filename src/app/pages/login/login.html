<div class="container d-flex align-items-center justify-content-center" style="min-height: 80vh;">
  <div class="card shadow-lg border-0" style="width: 100%; max-width: 400px; border-radius: 15px;">
    <div class="card-body p-5">
      <div class="text-center mb-4">
        <h2 class="fw-bold text-primary">Admin Panel</h2>
        <p class="text-muted">Ingresa tus credenciales para gestionar la tienda</p>
      </div>
      
      <form (submit)="onLogin()">
        <div class="mb-3">
          <label class="form-label small fw-bold">Correo Electrónico</label>
          <input [(ngModel)]="email" name="email" type="email" 
                 class="form-control form-control-lg" 
                 placeholder="admin@tienda.com" required>
        </div>
        
        <div class="mb-4">
          <label class="form-label small fw-bold">Contraseña</label>
          <input [(ngModel)]="pass" name="pass" type="password" 
                 class="form-control form-control-lg" 
                 placeholder="••••••••" required>
        </div>
        
        <button type="submit" class="btn btn-primary btn-lg w-100 shadow-sm" style="border-radius: 10px;">
          Iniciar Sesión
        </button>
      </form>
    </div>
  </div>
</div>
