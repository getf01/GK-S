<div class="container mt-5">
  <div class="row">
    <div class="col-12 text-center mb-4">
      <h1 class="display-5 fw-bold text-dark">Catálogo de Productos</h1>
      <hr class="w-25 mx-auto border-primary border-3">
    </div>
  </div>

  <div class="row row-cols-1 row-cols-md-2 row-cols-lg-4 g-4">
    @for (item of productos(); track item.id) {
      <div class="col">
        <div class="card h-100 shadow-sm border-0 rounded-3 overflow-hidden">
          <div style="height: 200px; overflow: hidden; background-color: #f8f9fa;">
            <img [src]="item.imagen" 
                 class="card-img-top w-100 h-100" 
                 [alt]="item.nombre"
                 style="object-fit: cover;">
          </div>
          
          <div class="card-body">
            <div class="d-flex justify-content-between align-items-start mb-2">
              <h5 class="card-title mb-0 fw-bold">{{ item.nombre }}</h5>
              <span class="badge bg-soft-primary text-primary border border-primary small">{{ item.categoria }}</span>
            </div>
            
            <p class="text-muted small mb-3">Stock: {{ item.stock }} unidades</p>
            
            <div class="d-flex justify-content-between align-items-center mt-auto">
              <span class="h4 mb-0 fw-bold text-success">S/ {{ item.precio }}</span>
              <button class="btn btn-primary btn-sm rounded-pill px-3">Agregar</button>
            </div>
          </div>
        </div>
      </div>
    } @empty {
      <div class="col-12 text-center py-5">
        <div class="spinner-border text-primary" role="status"></div>
        <p class="mt-2 text-muted">Cargando productos desde la tienda...</p>
      </div>
    }
  </div>
</div>
